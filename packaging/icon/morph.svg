<!-- Morph app icon (was candidate A, "Shape shift"): a violet tile where a square turns into a circle.
     Single source for packaging/Assets (make-assets.ps1): MSIX logos, morph.ico (Explorer menu, tray) and the window icon. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8E6BFF"/>
      <stop offset="1" stop-color="#4F3BE0"/>
    </linearGradient>
  </defs>
  <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#tile)"/>
  <rect x="48" y="48" width="104" height="104" rx="16" fill="#FFFFFF" fill-opacity="0.55"/>
  <circle cx="162" cy="162" r="58" fill="#FFFFFF"/>
</svg>

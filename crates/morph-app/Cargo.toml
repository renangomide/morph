[package]
name = "morph-app"
description = "Morph.exe: the Slint conversion window opened from the Explorer menu."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "Morph"
path = "src/main.rs"

[dependencies]
morph-formats = { workspace = true }
morph-core = { workspace = true }
# unstable-winit-030: files dropped from Explorer (WindowEvent::DroppedFile), main window.
slint = { workspace = true, features = ["raw-window-handle-06", "unstable-winit-030"] }
# Native "Choose folder…" picker (IFileOpenDialog on Windows).
rfd = { version = "0.17.2", default-features = false }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tray-icon = { version = "0.26.1", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
tracing-appender = "0.2.5"
ico = "0.6.0"
windows = { workspace = true, features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
embed-resource = "3.0.12"
morph-formats = { workspace = true }
slint-build = { workspace = true }

[lints]
workspace = true

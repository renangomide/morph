[package]
name = "morph-shell"
description = "Morph Explorer context-menu extension (IExplorerCommand COM server). Must stay tiny and never crash Explorer."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "morph_shell"
crate-type = ["cdylib"]

[dependencies]
morph-formats = { workspace = true }
uuid = { workspace = true }
windows-core = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true

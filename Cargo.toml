[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/renangomide/morph"
rust-version = "1.95"

[workspace.dependencies]
morph-formats = { path = "crates/morph-formats" }
morph-core = { path = "crates/morph-core" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.28.0", features = ["v4"] }
windows = "0.62.2"
windows-core = "0.62.2"
# Exact pin: the `unstable-winit-030` feature (morph-app) is outside semver.
slint = "=1.18.1"
slint-build = "=1.18.1"
anyhow = "1.0.104"
thiserror = "2.0.21"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"

# The shell DLL relies on catch_unwind to never crash Explorer: panics MUST unwind.
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1
